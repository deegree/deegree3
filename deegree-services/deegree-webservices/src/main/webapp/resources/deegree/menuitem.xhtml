<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
  xmlns:ui="jakarta.faces.facelets" xmlns:dg="http://deegree.org/jsf"
  xmlns:dgc="jakarta.faces.composite/deegree" xmlns:cc="jakarta.faces.composite"
  xmlns:c="jakarta.tags.core" xmlns:p="primefaces">

<cc:interface>
  <cc:attribute name="displayname" />
  <cc:attribute name="target" />
  <cc:attribute name="hasErrors" />
</cc:interface>

<cc:implementation>
  <p:outputPanel layout="block" styleClass="menuitem">
    <p:link value="#{cc.attrs.displayname}" outcome="#{cc.attrs.target}"
      styleClass="#{facesContext.viewRoot.viewId == cc.attrs.target ? 'naviactive' : 'navi'}" />
    <p:outputLabel styleClass="ui-button buttonError" rendered="#{cc.attrs.hasErrors}" value=" !" />
  </p:outputPanel>
</cc:implementation>

</html>
