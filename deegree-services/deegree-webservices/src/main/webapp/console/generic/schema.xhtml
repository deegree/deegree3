<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
  xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
  xmlns:fn="jakarta.tags.functions" xmlns:dg="http://deegree.org/jsf" xmlns:p="primefaces">
<f:metadata>
  <f:viewParam name="fileName" value="#{xmlEditorBean.fileName}" />
  <f:viewParam name="schemaUrl" value="#{xmlEditorBean.schemaUrl}" />
</f:metadata>  
<h:head>
  <title>Display XML schema</title>
</h:head>
<h:body>
  <h:outputFormat value="#{labels.schema_for}">
    <f:param value="${xmlEditorBean.fileName}" />
  </h:outputFormat>
  <br />
  <dg:outputXML id="schemaXML" value="${xmlEditorBean.schemaAsText}" downloadable="false" />
</h:body>
</html>
