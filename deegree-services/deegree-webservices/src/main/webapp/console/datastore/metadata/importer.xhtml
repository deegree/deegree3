<ui:composition template="/layout.xhtml" xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
  xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"
  xmlns:c="jakarta.tags.core" xmlns:fn="jakarta.tags.functions"
  xmlns:dg="http://deegree.org/jsf" xmlns:dgc="jakarta.faces.composite/deegree" xmlns:p="primefaces">
  <ui:define name="center">
    <p:outputPanel>
    Import metadata records into metadata store '<h:outputText value="#{msConfig.id}" />'<br />
      <br />
      <h:form>
        <div>
          <p:outputLabel styleClass="label" value="MetadataStore" />
        </div>
        <div>
          <br /> <br />
          <p:outputLabel styleClass="label" value="Import URL" />
          <h:inputText styleClass="liste" id="mdUrl" value="#{msImporter.url}" size="32" required="true"
            requiredMessage="#{labels.msImporter_url_req}" />
          <p:commandButton styleClass="ui-button buttonCreateNew" value="#{labels.msImporter_import}"
            action="#{msImporter.importData}" />
        </div>
      </h:form>
      <br />
      <br />
    </p:outputPanel>
  </ui:define>
</ui:composition>
