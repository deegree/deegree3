<ui:composition template="/layout.xhtml" xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
  xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"
  xmlns:c="jakarta.tags.core" xmlns:fn="jakarta.tags.functions"
  xmlns:dg="http://deegree.org/jsf" xmlns:dgc="jakarta.faces.composite/deegree" xmlns:p="primefaces">
  <ui:define name="center">
    <p:outputPanel>
      <fieldset class="fieldset">
        <legend>
          <h:outputText styleClass="title" value="Create new SQL feature store" />
        </legend>
        <h:form>
          <p>
            <h:selectOneRadio styleClass="label" value="#{mappingWizardSQL.mode}" layout="pageDirection">
              <f:selectItem itemValue="template" itemLabel="Create config manually" />
              <f:selectItem itemValue="schema" itemLabel="Create tables from GML application schema" />
              <f:selectItem itemDisabled="true" itemValue="tables" itemLabel="Map tables to simple feature types (TODO)" />
            </h:selectOneRadio>
          </p>
          <p>
            <p:outputLabel styleClass="label" for="jdbcConn" value="JDBC connection:" />
            <h:selectOneMenu id="jdbcConn" styleClass="liste" value="#{mappingWizardSQL.selectedJdbcConn}">
              <f:selectItems value="#{mappingWizardSQL.availableJdbcConns}" />
            </h:selectOneMenu>
          </p>
          <p>
            <p:commandButton styleClass="ui-button buttonCreateNew" value="Back" action="/console/datastore/feature" update=":container" global="false" />
            <p:commandButton styleClass="ui-button buttonCreateNew" value="Next" action="#{mappingWizardSQL.selectMode}" update=":container" global="false" />
          </p>
        </h:form>
      </fieldset>
    </p:outputPanel>
  </ui:define>
</ui:composition>
