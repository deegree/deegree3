<ui:composition template="/layout.xhtml" xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
  xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"
  xmlns:c="jakarta.tags.core" xmlns:fn="jakarta.tags.functions"
  xmlns:dg="http://deegree.org/jsf" xmlns:dgc="jakarta.faces.composite/deegree" xmlns:p="primefaces">
  <ui:define name="center">
    <p:outputPanel>
      <h:form>
        <p>
          Mapping
          <h:outputText value="#{mappingWizardSQL.appSchemaInfo.numFtsTotal}" />
          feature type(s).
          <p:commandButton styleClass="ui-button buttonCreateNew" value="Details"
            action="/console/featurestore/sql/schema_details"  update=":container" />
        </p>
        <p>
          Select storage mode:
          <h:selectOneRadio styleClass="label" value="#{mappingWizardSQL.storageMode}" layout="pageDirection">
            <f:selectItem itemValue="blob" itemLabel="BLOB: GML_OBJECTS table stores binary representations of features" />
            <f:selectItem itemValue="relational"
              itemLabel="Relational: One table per feature type (and additional tables for multi properties)" />
            <f:selectItem itemDisabled="true" itemValue="hybrid" itemLabel="Hybrid: Relational + BLOB (TODO)" />
          </h:selectOneRadio>
        </p>
        <p>
          <p:outputLabel styleClass="label" for="storageCrs" value="Storage CRS" />
          <h:inputText styleClass="liste" id="storageCrs" value="#{mappingWizardSQL.storageCrs}" size="32" />
        </p>
        <p>
          <p:outputLabel styleClass="label" for="tableLen" value="Maximum length for table names" />
          <h:inputText styleClass="liste" id="tableLen" value="#{mappingWizardSQL.tableNameLength}" size="3" />
          <p:outputLabel styleClass="label" for="columnLen" value="Maximum length for column names" />
          <h:inputText styleClass="liste" id="columnLen" value="#{mappingWizardSQL.columnNameLength}" size="3" />
        </p>
        <p>
          <p:commandButton styleClass="ui-button buttonCreateNew" value="Back" action="#{mappingWizardSQL.selectMode}"
             update=":container" />
          <p:commandButton styleClass="ui-button buttonCreateNew" value="Next" action="#{mappingWizardSQL.generateConfig}"
             update=":container" />
        </p>
      </h:form>
    </p:outputPanel>
  </ui:define>
</ui:composition>
