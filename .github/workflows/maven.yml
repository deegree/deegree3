name: Java CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: temurin
        cache: 'maven'
    - name: Build with Maven
      run: ./mvnw -B -q -ff test --file pom.xml
